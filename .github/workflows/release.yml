name: release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    # define multiple targets
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: dot
            asset_name: dot-linux
          - os: windows-latest
            executable: dot.exe
            asset_name: dot-windows
          - os: macos-latest
            executable: dot
            asset_name: dot-macos

    # build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: enable toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: build
        run: cargo build --release

      - name: Set enviroment for github-release
        run: |
          echo "RELEASE_TAG=$( echo ${GITHUB_REF##*/} )" >> $GITHUB_ENV

      - name: create archive
        run: |
          cd target/release
          tar -czf "${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz" "${{ matrix.executable }}"

      - name: checksum
        run: |
          cd target/release/
          ARCHIVE="${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            target/release/${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz
            target/release/${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
